# OWASP Juice Shop - intentionally vulnerable app for security testing.
# Runs on ubuntu-lab (native Docker Engine), standalone compose project.
#
# ISOLATION POSTURE (see README.md):
#   - No restart policy: started by hand for a testing session, stays down
#     after a reboot. Never let a deliberately vulnerable app auto-start.
#   - Published on the LAN interface ONLY (LAN_IP), not 0.0.0.0, so it is not
#     exposed over Tailscale.
#   - Own compose project, so its default network is shared with no other service.
#   - Not behind Nginx Proxy Manager: no .lab hostname, no TLS, no proxy entry.

services:
  juice-shop:
    image: bkimminich/juice-shop
    container_name: juice-shop
    ports:
      # host_ip:host_port:container_port - the host_ip is the isolation control.
      - "${LAN_IP:?set LAN_IP in .env}:8082:3000"
    volumes:
      # Juice Shop writes its per-request access log here (access.log.<date>).
      # The Wazuh agent on ubuntu-lab tails it from the host path.
      - /opt/juice-shop/logs:/juice-shop/logs
    restart: "no"
