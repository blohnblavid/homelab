# TAILSCALE_IP and UBUNTU_LAB_IP are placeholders for the real addresses.
- Infrastructure:
    - Portainer:
        # Bound to the K16's Tailscale IP only.
        href: http://TAILSCALE_IP:9000
        description: Docker Management
        icon: portainer.png
    - Pihole:
        # Runs on ubuntu-lab.
        href: http://UBUNTU_LAB_IP/admin
        description: DNS & Ad Blocking
        icon: pi-hole.png
    - Nginx Proxy Manager:
        href: http://homeserver:81
        description: Reverse Proxy
        icon: nginx-proxy-manager.png
    - Uptime Kuma:
        href: http://homeserver:3001
        description: Uptime Monitor
        icon: uptime-kuma.png
        widget:
          type: uptimekuma
          url: http://homeserver:3001
          slug: homeserver
    - Netdata:
        # Bound to the K16's Tailscale IP only.
        href: http://TAILSCALE_IP:19999
        description: System Metrics
        icon: netdata.png
    - Immich:
        href: http://homeserver:2283
        description: Photo & Video Backup
        icon: immich.png
- Security:
    - Wazuh:
        # Runs on ubuntu-lab; the dashboard is published on 443.
        href: https://UBUNTU_LAB_IP
        description: Security Monitoring
        icon: wazuh.png
    - Vaultwarden:
        # Placeholder: replace YOUR-TAILNET with the tailnet's MagicDNS name.
        href: https://homeserver.YOUR-TAILNET.ts.net
        description: Password Manager
        icon: vaultwarden.png
