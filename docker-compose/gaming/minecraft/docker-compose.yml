# NeoForge Minecraft server behind lazymc. lazymc holds port 25565, starts the
# server container when a player connects, and stops it again when idle.
networks:
  mc-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

services:
  lazymc:
    image: ghcr.io/joesturge/lazymc-docker-proxy:latest
    container_name: lazymc
    networks:
      mc-net:
        ipv4_address: 172.25.0.2
    restart: unless-stopped
    ports:
      - "25565:25565"
    volumes:
      - ./data:/server:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  minecraft:
    image: itzg/minecraft-server
    container_name: minecraft
    networks:
      mc-net:
        # Fixed address so lazymc knows where to forward.
        ipv4_address: 172.25.0.3
    labels:
      - lazymc.enabled=true
      - lazymc.group=minecraft
      - lazymc.server.address=172.25.0.3:25565
    tty: true
    stdin_open: true
    environment:
      EULA: "TRUE"
      TYPE: "NEOFORGE"
      VERSION: "26.3"
      NEOFORGE_VERSION: "26.3.0.76"
      MEMORY: "6G"
    volumes:
      - ./data:/data
    # lazymc starts and stops this container; it must not restart on its own.
    restart: "no"
